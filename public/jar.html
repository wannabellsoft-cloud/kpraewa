<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Gift Jar (OBS)</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=JetBrains+Mono:wght@500&family=Sarabun:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* --gift-base lives only on :root so applyJarSettings (which sets it on
     documentElement) cascades down to .gift. Defining it on <body> too would
     shadow the override and freeze gift size at 56px. */
  :root { --gift-base: 56px; }
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    overflow: hidden;
    height: 100vh; width: 100vw;
    font-family: 'Sarabun', sans-serif;
    color: #fff;
  }

  .stage {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 32px;
  }

  /* ===== Header ===== */
  .header {
    position: absolute;
    top: 24px; left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    z-index: 8;            /* stay above gifts that overflow the jar mouth */
  }
  .header .label {
    font-size: 11px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.65);
    font-weight: 600;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
  .header .count {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 64px;
    line-height: 1;
    margin-top: 4px;
    color: #ffe5ec;
    text-shadow: 0 4px 16px rgba(255, 100, 140, 0.6), 0 0 24px rgba(255, 150, 180, 0.4);
    font-weight: 500;
  }
  .header .count.bump { animation: countPop 0.5s cubic-bezier(.34,1.6,.6,1); }
  @keyframes countPop {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.28); color: #fff; }
    100% { transform: scale(1); }
  }
  .header .sub {
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(255,229,236,0.7);
    font-weight: 500;
    margin-top: 6px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }
  /* Lab theme tweaks the header palette */
  .stage.theme-lab .header .count {
    color: #d6ffeb;
    text-shadow: 0 4px 16px rgba(90, 220, 200, 0.65), 0 0 24px rgba(120, 240, 220, 0.4);
  }
  .stage.theme-lab .header .sub { color: rgba(214,255,235,0.7); }

  /* ===== Jar container ===== */
  .jar-container {
    position: relative;
    width: 380px;
    height: 540px;
    /* gentle living sway — origin at the base so it tips like a real jar */
    transform-origin: 50% 94%;
    animation: jarWobble 6.5s ease-in-out infinite;
  }
  @keyframes jarWobble {
    0%, 100% { transform: rotate(-1.2deg); }
    50%      { transform: rotate(1.2deg); }
  }
  .jar-svg {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 3;
    filter: drop-shadow(0 30px 40px rgba(0,0,0,0.32));
  }

  /* Glass-theme gift area — straight-sided mason jar.
     Starts below the bow (y=186) and the polygon clips a rectangle with
     chamfered, rounded bottom corners that trace the jar base. */
  .jar-content {
    position: absolute;
    left: 72px;
    right: 72px;
    top: 186px;
    bottom: 36px;
    /* overflow visible + a clip-path that is unbounded upward (-260%) lets
       the pile spill ABOVE the jar mouth when full, while the rounded
       bottom corners are still traced so gifts hug the jar base. */
    overflow: visible;
    clip-path: polygon(
      0% -260%, 100% -260%,
      100% 86%,
      93% 95%, 82% 100%,
      18% 100%, 7% 95%,
      0% 86%
    );
    z-index: 2;
  }

  /* Lab-theme gift area — clip-path traces the Erlenmeyer cone. */
  .stage.theme-lab .jar-content {
    left: 50px;
    right: 50px;
    top: 220px;
    bottom: 30px;
    overflow: visible;
    border-radius: 0 0 70px 70px / 0 0 40px 40px;
    /* neck column opens upward (-400%) so a full flask overflows up the neck */
    clip-path: polygon(
      36.5% -400%,
      63.5% -400%,
      100% 96%,
      88% 100%,
      12% 100%,
      0% 96%
    );
  }

  /* ===== Theme show/hide ===== */
  .theme-svg { display: none; }
  .stage.theme-glass .theme-glass { display: block; }
  .stage.theme-lab   .theme-lab   { display: block; }

  /* ===== Sparkle twinkle (SVG decorations) ===== */
  .twinkle {
    transform-box: fill-box;
    transform-origin: center;
    animation: twinkle 2.6s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.35; transform: scale(0.7); }
    50%      { opacity: 1;    transform: scale(1.12); }
  }

  /* ===== Gift element ===== */
  .gift {
    position: absolute;
    width: var(--gift-base);
    height: var(--gift-base);
    display: flex; align-items: center; justify-content: center;
    border-radius: 14px;
    font-weight: 700;
    color: #1a1416;
    font-size: 22px;
    box-shadow:
      inset 0 -6px 14px rgba(0,0,0,0.15),
      inset 0 3px 6px rgba(255,255,255,0.35),
      0 4px 14px rgba(0,0,0,0.3);
    transform-origin: 50% 100%;     /* squash onto its base when it lands */
    will-change: transform, opacity;
    user-select: none;
    overflow: hidden;
  }
  .gift.has-image {
    background: transparent !important;
    border-radius: 0;
    box-shadow: none;
    overflow: visible;
  }
  .gift.has-image img {
    width: 100%; height: 100%;
    object-fit: contain;
    border-radius: 0;
    display: block;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5));
  }
  .gift.no-image { color: rgba(0,0,0,0.55); }
  .gift.combo-2  { width: calc(var(--gift-base) * 1.18); height: calc(var(--gift-base) * 1.18); }
  .gift.combo-5  { width: calc(var(--gift-base) * 1.35); height: calc(var(--gift-base) * 1.35); }
  .gift.combo-10 { width: calc(var(--gift-base) * 1.6);  height: calc(var(--gift-base) * 1.6); }
  .gift.combo-50 { width: calc(var(--gift-base) * 1.85); height: calc(var(--gift-base) * 1.85); }
  .gift.tier-pricey { box-shadow:
    inset 0 -6px 14px rgba(0,0,0,0.18),
    inset 0 3px 6px rgba(255,255,255,0.4),
    0 6px 22px rgba(255,180,120,0.5),
    0 0 14px rgba(255,200,140,0.5); }
  .gift.tier-luxe { box-shadow:
    inset 0 -6px 14px rgba(0,0,0,0.2),
    inset 0 3px 6px rgba(255,255,255,0.45),
    0 8px 28px rgba(255,120,180,0.65),
    0 0 22px rgba(255,140,200,0.7); }

  /* New gravity fall: accelerate down, hit, squash, rebound, settle.
     transform-origin is the gift's base so the squash reads as weight. */
  @keyframes fall {
    0%   { transform: translateY(-230px) rotate(var(--start-r, -30deg)) scale(0.6);   opacity: 0; }
    12%  { opacity: 1; }
    58%  { transform: translateY(var(--land-y)) rotate(var(--land-r, 0deg)) scale(1); }
    68%  { transform: translateY(var(--land-y)) rotate(var(--land-r, 0deg)) scaleX(1.18) scaleY(0.80); }
    80%  { transform: translateY(calc(var(--land-y) - 12px)) rotate(var(--land-r, 0deg)) scaleX(0.93) scaleY(1.08); }
    90%  { transform: translateY(var(--land-y)) rotate(var(--land-r, 0deg)) scaleX(1.04) scaleY(0.96); }
    100% { transform: translateY(var(--land-y)) rotate(var(--land-r, 0deg)) scale(1); }
  }
  .gift.falling { animation: fall var(--fall-dur, 1.2s) cubic-bezier(.45,.05,.55,.95) forwards; }

  /* Soft landing puff that blooms where a gift settles */
  .puff {
    position: absolute;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.7), rgba(255,210,225,0));
    transform: translate(-50%, -50%) scale(0.3);
    opacity: 0;
    pointer-events: none;
    animation: puff 0.5s ease-out forwards;
    z-index: 3;
  }
  @keyframes puff {
    0%   { opacity: 0.8; transform: translate(-50%,-50%) scale(0.3); }
    100% { opacity: 0;   transform: translate(-50%,-50%) scale(1.4); }
  }

  /* ===== Combo flash + heart burst ===== */
  @keyframes pop {
    0%   { transform: translate(-50%,-50%) scale(0);    opacity: 0; }
    45%  { transform: translate(-50%,-50%) scale(1.15); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(0.9);  opacity: 0; }
  }
  .combo-flash {
    position: absolute;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 64px;
    color: #ffd166;
    text-shadow: 0 0 16px rgba(255,209,102,0.7), 0 4px 12px rgba(0,0,0,0.5);
    pointer-events: none;
    animation: pop 1s ease forwards;
    z-index: 6;
  }
  .heart-pop {
    position: absolute;
    font-size: 20px;
    color: #ff8cab;
    pointer-events: none;
    text-shadow: 0 2px 6px rgba(0,0,0,0.35);
    animation: heartFloat 1.1s ease-out forwards;
    z-index: 6;
  }
  @keyframes heartFloat {
    0%   { transform: translate(-50%,-50%) translateY(0) scale(0.4); opacity: 0; }
    25%  { opacity: 1; }
    100% { transform: translate(-50%,-50%) translateY(-130px) translateX(var(--hx,0)) scale(1) rotate(var(--hr,0deg)); opacity: 0; }
  }

  /* Latest gifter banner */
  .latest {
    position: absolute;
    bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 999px;
    padding: 10px 22px;
    display: flex; align-items: center; gap: 12px;
    opacity: 0;
    transition: opacity 0.4s, transform 0.4s cubic-bezier(.34,1.6,.6,1);
    pointer-events: none;
    z-index: 5;
  }
  .latest.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .latest .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff8cab, #d4677c);
    border: 2px solid #fff;
    overflow: hidden;
    flex-shrink: 0;
  }
  .stage.theme-lab .latest .avatar {
    background: linear-gradient(135deg, #5ed4c8, #2a8076);
  }
  .latest .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .latest .info { display: flex; flex-direction: column; line-height: 1.15; }
  .latest .info .who { font-size: 14px; font-weight: 700; color: #fff; }
  .latest .info .what {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,229,236,0.85);
    font-weight: 500;
  }
  .latest .info .what em { color: #ffd166; font-style: normal; font-weight: 700; }
  .stage.theme-lab .latest .info .what { color: rgba(214,255,235,0.85); }
  .stage.theme-lab .latest .info .what em { color: #9ef0d8; }

  /* Lab theme — bubbles rising through the liquid */
  .bubble {
    position: absolute;
    bottom: 50px;
    width: 6px; height: 6px;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.3));
    border-radius: 50%;
    opacity: 0;
    animation: rise 3.4s ease-in infinite;
    pointer-events: none;
    z-index: 3;
  }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    10%  { opacity: 0.9; }
    100% { transform: translateY(-180px) translateX(var(--drift, 0px)); opacity: 0; }
  }
</style>
</head>
<body>

<div id="rtStatus" style="
  position: fixed; top: 10px; left: 10px; z-index: 99;
  background: rgba(0,0,0,0.6); color: #ffe5ec; font-family: sans-serif;
  font-size: 11px; padding: 4px 10px; border-radius: 999px;
  letter-spacing: 0.08em; opacity: 0.6;">connecting…</div>

<div class="stage theme-glass" id="stage">

  <div class="header">
    <div class="label">Gifts received</div>
    <div class="count" id="giftCount">0</div>
    <div class="sub"><span id="diamondTotal">0</span> diamonds</div>
  </div>

  <div class="jar-container" id="jarContainer">

    <!-- ===================================================================
         GLASS THEME — cute watercolor mason jar
         viewBox 0 0 380 540 · light top-left · stroke ink #c47585
         landmarks: lid y70-128 · body sides x68/x312 · floor y506
         =================================================================== -->
    <svg class="jar-svg theme-svg theme-glass" viewBox="0 0 380 540" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="g_glass" cx="50%" cy="58%" r="60%">
          <stop offset="0%"   stop-color="rgba(255,228,238,0.05)"/>
          <stop offset="62%"  stop-color="rgba(255,205,220,0.14)"/>
          <stop offset="100%" stop-color="rgba(240,150,180,0.30)"/>
        </radialGradient>
        <linearGradient id="g_lid" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%"   stop-color="#ffdce5"/>
          <stop offset="100%" stop-color="#e98aa6"/>
        </linearGradient>
        <linearGradient id="g_bow" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%"   stop-color="#ffd6e0"/>
          <stop offset="100%" stop-color="#f29ab1"/>
        </linearGradient>
        <linearGradient id="g_knot" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%"   stop-color="#f29ab1"/>
          <stop offset="100%" stop-color="#c8657d"/>
        </linearGradient>
        <linearGradient id="g_heart" x1="0" x2="1" y1="0" y2="1">
          <stop offset="0%"   stop-color="#ffabc2"/>
          <stop offset="100%" stop-color="#d4677c"/>
        </linearGradient>
        <linearGradient id="g_wash" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%"   stop-color="rgba(245,150,180,0)"/>
          <stop offset="50%"  stop-color="rgba(245,150,180,0.40)"/>
          <stop offset="100%" stop-color="rgba(245,150,180,0)"/>
        </linearGradient>
        <radialGradient id="g_pearl" cx="35%" cy="32%" r="65%">
          <stop offset="0%"   stop-color="#ffffff"/>
          <stop offset="55%"  stop-color="#fde7ec"/>
          <stop offset="100%" stop-color="#e6b8c4"/>
        </radialGradient>
      </defs>

      <!-- 1. Atmosphere — ground watercolor stain -->
      <g>
        <ellipse cx="190" cy="520" rx="150" ry="13" fill="rgba(245,180,200,0.30)"/>
        <ellipse cx="190" cy="525" rx="112" ry="6"  fill="rgba(245,180,200,0.42)"/>
      </g>

      <!-- 2. Silhouette — straight-sided jar body (single subpath) -->
      <path d="M 96 128
               C 78 132 68 152 68 182
               L 68 452
               C 68 492 92 506 120 506
               L 260 506
               C 288 506 312 492 312 452
               L 312 182
               C 312 152 302 132 284 128
               Z"
            fill="url(#g_glass)"
            stroke="#c47585" stroke-width="2.5"
            stroke-linejoin="round" stroke-linecap="round"/>

      <!-- 3. Body details — sketch double-stroke + washes + highlights -->
      <g>
        <!-- offset sketch stroke (watercolor) -->
        <path d="M 72 188 L 72 450" fill="none" stroke="#e89bb0" stroke-width="1" opacity="0.55"/>
        <path d="M 308 188 L 308 450" fill="none" stroke="#e89bb0" stroke-width="1" opacity="0.5"/>
        <!-- pink pigment wash down each side -->
        <path d="M 80 210 L 80 450" fill="none" stroke="url(#g_wash)" stroke-width="22" opacity="0.5"/>
        <path d="M 300 210 L 300 450" fill="none" stroke="url(#g_wash)" stroke-width="20" opacity="0.45"/>
        <!-- left glass highlight streak (top-left light) -->
        <path d="M 88 200 Q 78 330 96 470"
              fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="4"
              stroke-linecap="round" opacity="0.7"/>
        <path d="M 104 230 Q 100 330 110 430"
              fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.4"/>
        <!-- tiny inner sparkle dots -->
        <circle cx="140" cy="400" r="1.8" fill="rgba(255,255,255,0.7)"/>
        <circle cx="246" cy="440" r="1.5" fill="rgba(255,255,255,0.6)"/>
        <circle cx="166" cy="462" r="1.4" fill="rgba(255,255,255,0.6)"/>
      </g>

      <!-- 4. Foreground structure — pink screw lid -->
      <g>
        <!-- rim plate -->
        <rect x="84" y="68" width="212" height="22" rx="11"
              fill="url(#g_lid)" stroke="#c8657d" stroke-width="2.2"/>
        <!-- screw band -->
        <path d="M 92 90 L 288 90 Q 294 90 294 96 L 294 122
                 Q 294 128 288 128 L 92 128 Q 86 128 86 122 L 86 96
                 Q 86 90 92 90 Z"
              fill="url(#g_lid)" stroke="#c8657d" stroke-width="2.2" stroke-linejoin="round"/>
        <!-- band ridges -->
        <g stroke="#c8657d" stroke-width="1" opacity="0.5">
          <path d="M 112 98 L 112 122" fill="none"/>
          <path d="M 148 98 L 148 122" fill="none"/>
          <path d="M 232 98 L 232 122" fill="none"/>
          <path d="M 268 98 L 268 122" fill="none"/>
        </g>
        <!-- lid sheen -->
        <path d="M 96 78 Q 190 72 286 78" fill="none"
              stroke="rgba(255,255,255,0.65)" stroke-width="2" stroke-linecap="round"/>
        <!-- pearl row across the rim -->
        <g>
          <circle cx="100" cy="79" r="3.4" fill="url(#g_pearl)" stroke="#c8657d" stroke-width="0.4"/>
          <circle cx="124" cy="79" r="3.4" fill="url(#g_pearl)" stroke="#c8657d" stroke-width="0.4"/>
          <circle cx="148" cy="79" r="3.4" fill="url(#g_pearl)" stroke="#c8657d" stroke-width="0.4"/>
          <circle cx="232" cy="79" r="3.4" fill="url(#g_pearl)" stroke="#c8657d" stroke-width="0.4"/>
          <circle cx="256" cy="79" r="3.4" fill="url(#g_pearl)" stroke="#c8657d" stroke-width="0.4"/>
          <circle cx="280" cy="79" r="3.4" fill="url(#g_pearl)" stroke="#c8657d" stroke-width="0.4"/>
        </g>
      </g>

      <!-- 5/6. Hero ornament — bow tied on the neck -->
      <g>
        <!-- tails (drawn first, behind wings) -->
        <path d="M 172 150 L 160 196 L 176 198 L 186 182 L 180 172 L 186 162 Z"
              fill="url(#g_bow)" stroke="#c8657d" stroke-width="2" stroke-linejoin="round"/>
        <path d="M 208 150 L 220 196 L 204 198 L 194 182 L 200 172 L 194 162 Z"
              fill="url(#g_bow)" stroke="#c8657d" stroke-width="2" stroke-linejoin="round"/>
        <!-- left wing -->
        <path d="M 190 130
                 C 152 112 106 124 100 158
                 C 97 184 132 192 162 182
                 C 180 176 190 154 190 138 Z"
              fill="url(#g_bow)" stroke="#c8657d" stroke-width="2" stroke-linejoin="round"/>
        <path d="M 116 154 Q 142 174 168 172" fill="none" stroke="#c8657d" stroke-width="1.2" opacity="0.6"/>
        <!-- right wing (mirrored, nudged for asymmetry) -->
        <path d="M 190 130
                 C 228 111 276 124 281 159
                 C 284 185 248 193 218 182
                 C 200 176 190 154 190 138 Z"
              fill="url(#g_bow)" stroke="#c8657d" stroke-width="2" stroke-linejoin="round"/>
        <path d="M 264 155 Q 238 175 212 172" fill="none" stroke="#c8657d" stroke-width="1.2" opacity="0.6"/>
        <!-- center knot (hero — warmest element) -->
        <ellipse cx="190" cy="150" rx="17" ry="20" fill="url(#g_knot)" stroke="#a8556c" stroke-width="2"/>
        <path d="M 178 132 Q 178 150 178 168" stroke="#a8556c" stroke-width="1" fill="none" opacity="0.5"/>
        <path d="M 202 132 Q 202 150 202 168" stroke="#a8556c" stroke-width="1" fill="none" opacity="0.5"/>
      </g>

      <!-- 7. Hanging detail — gold ring + heart charm -->
      <g>
        <line x1="190" y1="170" x2="190" y2="180" stroke="#a8556c" stroke-width="1.5"/>
        <ellipse cx="190" cy="181" rx="4" ry="2.6" fill="#f5d68a" stroke="#b48a3e" stroke-width="0.9"/>
        <path d="M 190 186
                 c -8,-10 -20,-3 -15,7
                 c 4,8 15,15 15,15
                 c 0,0 11,-7 15,-15
                 c 5,-10 -7,-17 -15,-7 Z"
              fill="url(#g_heart)" stroke="#a8556c" stroke-width="1.3"/>
        <ellipse cx="184" cy="194" rx="2.6" ry="4" fill="rgba(255,255,255,0.8)"/>
      </g>

      <!-- 8. Top-most — twinkling sparkles + tiny hearts (scattered, odd) -->
      <g fill="#f5c64d">
        <path class="twinkle" style="animation-delay:0s"   d="M 44 156 l 2 -6 l 2 6 l 6 2 l -6 2 l -2 6 l -2 -6 l -6 -2 z"/>
        <path class="twinkle" style="animation-delay:0.9s" d="M 334 214 l 1.6 -5 l 1.6 5 l 5 1.6 l -5 1.6 l -1.6 5 l -1.6 -5 l -5 -1.6 z"/>
        <path class="twinkle" style="animation-delay:1.7s" d="M 52 430 l 1.4 -4 l 1.4 4 l 4 1.4 l -4 1.4 l -1.4 4 l -1.4 -4 l -4 -1.4 z"/>
      </g>
      <g fill="#ffabc2" opacity="0.8">
        <path class="twinkle" style="animation-delay:0.5s" d="M 30 250 c -3,-4 -8,-2 -7,2 c 1,3 7,6 7,7 c 0,0 6,-4 7,-7 c 1,-4 -4,-6 -7,-2 z"/>
        <path class="twinkle" style="animation-delay:1.3s" d="M 352 360 c -2.6,-3.4 -7,-1.6 -6,1.6 c 0.9,2.6 6,5 6,6 c 0,0 5,-3.4 6,-6 c 0.9,-3.2 -3.4,-5 -6,-1.6 z"/>
      </g>
    </svg>

    <!-- ===================================================================
         LAB THEME — Erlenmeyer flask
         =================================================================== -->
    <svg class="jar-svg theme-svg theme-lab" viewBox="0 0 380 540" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="l_glass" x1="0" x2="1" y1="0" y2="1">
          <stop offset="0%" stop-color="rgba(180,255,235,0.18)"/>
          <stop offset="50%" stop-color="rgba(140,220,210,0.05)"/>
          <stop offset="100%" stop-color="rgba(180,255,235,0.15)"/>
        </linearGradient>
        <linearGradient id="l_liquid" x1="0" x2="0" y1="0" y2="1">

      <text x="190" y="392" text-anchor="middle"
            font-family="Cormorant Garamond, serif" font-style="italic" font-weight="600"
            font-size="14" fill="#d6ffeb" letter-spacing="2">k.praewa LAB</text>
      <text x="190" y="408" text-anchor="middle"
            font-family="JetBrains Mono, monospace"
            font-size="9" fill="rgba(214,255,235,0.75)" letter-spacing="2">EXPERIMENT N°001</text>

      <!-- Highlights -->
      <path d="M 80 260 L 60 460" stroke="url(#l_shine)" stroke-width="6" opacity="0.5"/>
      <path d="M 250 260 L 295 440" stroke="url(#l_shine)" stroke-width="3" opacity="0.3"/>

      <!-- Twinkling chemistry sparkles -->
      <g fill="rgba(214,255,235,0.6)">
        <path class="twinkle" style="animation-delay:0s"   d="M 28 260 l 1.5 -4 l 1.5 4 l 4 1.5 l -4 1.5 l -1.5 4 l -1.5 -4 l -4 -1.5 z"/>
        <path class="twinkle" style="animation-delay:1s"   d="M 352 290 l 1.5 -4 l 1.5 4 l 4 1.5 l -4 1.5 l -1.5 4 l -1.5 -4 l -4 -1.5 z"/>
        <path class="twinkle" style="animation-delay:1.8s" d="M 18 410 l 1 -3 l 1 3 l 3 1 l -3 1 l -1 3 l -1 -3 l -3 -1 z"/>

    </svg>

    <!-- Bubbles (Lab theme only) -->
    <div class="lab-bubbles" id="labBubbles"></div>

    <!-- Gifts pile up inside this -->
    <div class="jar-content" id="jarContent"></div>

    <!-- Latest gifter banner -->
    <div class="latest" id="latest">
      <div class="avatar"><img id="latestAvatar" alt=""/></div>
      <div class="info">
        <div class="who" id="latestWho"></div>
        <div class="what" id="latestWhat"></div>

</div>

<script src="/assets/realtime-client.js"></script>
<script>
  const jarContent = document.getElementById('jarContent');
  const jarContainer = document.getElementById('jarContainer');
  const stage = document.getElementById('stage');
  const countEl = document.getElementById('giftCount');
  const diamondEl = document.getElementById('diamondTotal');
  const latestBox = document.getElementById('latest');
  const latestWho = document.getElementById('latestWho');
  const latestWhat = document.getElementById('latestWhat');
  const latestAvatar = document.getElementById('latestAvatar');
  const labBubblesBox = document.getElementById('labBubbles');

  let giftTotal = 0;
  let diamondTotal = 0;
  let latestHideTimer;
  // Physics state: every placed gift's bounding box so newcomers can stack on them.
  let placedGifts = [];   // inside the jar

  // Runtime settings — overridden by /api/settings + realtime updates
  let SETTINGS = {
    jar: { theme: 'glass', minDiamonds: 0, baseSize: 56, scaleByDiamonds: true }
  };

  function applyJarSettings(s) {
    const j = s?.jar || {};
    const theme = (j.theme === 'lab') ? 'lab' : 'glass';
    stage.classList.toggle('theme-glass', theme === 'glass');
    stage.classList.toggle('theme-lab',   theme === 'lab');
    document.documentElement.style.setProperty('--gift-base', (j.baseSize || 56) + 'px');
    SETTINGS = s;
    renderBubbles(theme === 'lab' ? 8 : 0);
  }

  function renderBubbles(n) {
    labBubblesBox.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const b = document.createElement('div');
      b.className = 'bubble';
      b.style.left = (60 + Math.random() * 260) + 'px';
      b.style.setProperty('--drift', (Math.random() * 30 - 15) + 'px');
      b.style.animationDelay = (i * 0.5) + 's';
      b.style.animationDuration = (3 + Math.random() * 2) + 's';
      labBubblesBox.appendChild(b);
    }
  }

  // ===== Gift styling fallbacks (when no TikTok image URL) =====
  const GIFT_STYLES = {
    rose:       { bg: 'linear-gradient(135deg,#ffb8c5,#e093a1)', glyph: '✿' },
    heart:      { bg: 'linear-gradient(135deg,#ff8ca0,#d4677c)', glyph: '♥' },
    star:       { bg: 'linear-gradient(135deg,#ffe28a,#ffd166)', glyph: '★' },
    diamond:    { bg: 'linear-gradient(135deg,#a3d4ff,#5eb0ff)', glyph: '♦' },
    coin:       { bg: 'linear-gradient(135deg,#ffe28a,#d4af6a)', glyph: '$' },
    crown:      { bg: 'linear-gradient(135deg,#ffd56b,#b48a3e)', glyph: '♕' },
    cake:       { bg: 'linear-gradient(135deg,#ffcfd9,#f095a8)', glyph: '◉' },
    coffee:     { bg: 'linear-gradient(135deg,#d6a572,#8c5a30)', glyph: '◈' },
    galaxy:     { bg: 'linear-gradient(135deg,#7f5af0,#3a1f6b)', glyph: '✦' },
    universe:   { bg: 'linear-gradient(135deg,#5a4a8a,#1a1340)', glyph: '✧' },
    rainbow:    { bg: 'linear-gradient(135deg,#ff9aa2,#ffb482,#ffe28a,#9ee6a0,#9ad7e0,#bda2eb)', glyph: '◐' }
  };
  function styleFor(type) {
    const key = (type || '').toLowerCase();
    for (const k of Object.keys(GIFT_STYLES)) if (key.includes(k)) return GIFT_STYLES[k];
    return { bg: 'linear-gradient(135deg,#ffc7d5,#e093a1)', glyph: '◆' };
  }

  function pickComboClass(repeat) {
    if (repeat >= 50) return 'combo-50';
    if (repeat >= 10) return 'combo-10';
    if (repeat >= 5)  return 'combo-5';
    if (repeat >= 2)  return 'combo-2';
    return '';
  }
  function pickTierClass(diamonds) {
    if (diamonds >= 100) return 'tier-luxe';
    if (diamonds >= 20)  return 'tier-pricey';
    return '';
  }

  function placeGift(gift, silent = false) {
    const w = jarContent.clientWidth;
    const h = jarContent.clientHeight;
    const repeat = Math.max(1, gift.repeatCount || 1);
    const drops = Math.min(repeat, 12);
    if (silent) {
      for (let i = 0; i < drops; i++) spawnGift(gift, w, h, true);
      return;
    }
    for (let i = 0; i < drops; i++) {
      setTimeout(() => spawnGift(gift, w, h, false), i * 90);
    }
    if (repeat >= 5) {
      const flash = document.createElement('div');
      flash.className = 'combo-flash';
      flash.textContent = '×' + repeat;
      flash.style.top = '40%';
      flash.style.left = '50%';
      jarContainer.appendChild(flash);
      setTimeout(() => flash.remove(), 1100);
      burstHearts();
    }
  }

  // Combo heart burst — a handful of hearts float up from the jar mouth.
  function burstHearts() {
    const n = 5;
    for (let i = 0; i < n; i++) {
      const heart = document.createElement('div');
      heart.className = 'heart-pop';
      heart.textContent = '♥';
      heart.style.left = (38 + Math.random() * 24) + '%';
      heart.style.top = (44 + Math.random() * 8) + '%';
      heart.style.setProperty('--hx', (Math.random() * 80 - 40) + 'px');
      heart.style.setProperty('--hr', (Math.random() * 40 - 20) + 'deg');
      heart.style.animationDelay = (i * 0.07) + 's';
      heart.style.fontSize = (16 + Math.random() * 12) + 'px';
      jarContainer.appendChild(heart);
      setTimeout(() => heart.remove(), 1300);
    }
  }

  // ===== Stacking physics — INSIDE the jar =====
  function findStackY(centerX, size) {
    const h = jarContent.clientHeight;
    let y = h - size - 4;
    for (const p of placedGifts) {
      const pCenterX = p.left + p.size / 2;
      const horzDist = Math.abs(centerX - pCenterX);
      // Tighter horizontal reach → gifts nestle close together, fewer gaps.
      const minHorz = (size + p.size) / 2 * 0.66;
      if (horzDist < minHorz) {
        // Deeper overlap (sit ~34% into the gift below) → a dense, packed heap.
        const candidate = p.top - size + Math.min(size, p.size) * 0.34;
        if (candidate < y) y = candidate;
      }
    }
    // Return the true stack height (may be negative when the pile would climb
    // above the rim). The caller uses this to decide the jar is "full" and to
    // recycle an existing slot instead of clamping a band at the top.
    return y;
  }

  // Gifts always stack INSIDE the jar (they may pile above the mouth as it fills).
  function pickPlacement(size) {
    const w = jarContent.clientWidth;
    const h = jarContent.clientHeight;
    const isLab = stage.classList.contains('theme-lab');
    const candidates = [];

    for (let i = 0; i < 40; i++) {
      let centerX;
      if (isLab) {
        centerX = w * 0.5 + (Math.random() - 0.5) * w * 0.88;
      } else {
        const padX = 4;
        centerX = padX + size / 2 + Math.random() * Math.max(0, (w - size - padX * 2));
      }
      const left = centerX - size / 2;
      if (left < 2 || left + size > w - 2) continue;
      const top = findStackY(centerX, size);

      if (isLab) {
        const cy = top + size / 2;
        const yRatio = Math.max(0, Math.min(1, cy / h));
        const halfwidth = 0.13 + (0.50 - 0.13) * yRatio;
        const minCx = (0.5 - halfwidth) * w;
        const maxCx = (0.5 + halfwidth) * w;
        if (centerX < minCx || centerX > maxCx) continue;
      }
      candidates.push({ left, top, size });
    }

    // Keep only placements that fit fully inside the jar body (top >= 0).
    // If nothing fits, the jar is full → signal the caller to recycle a slot.
    const fit = candidates.filter(c => c.top >= 0);
    if (!fit.length) return { full: true };

    fit.sort((a, b) => b.top - a.top);
    const pickFrom = Math.min(5, fit.length);
    const r = Math.pow(Math.random(), 2.4);
    const idx = Math.floor(r * pickFrom);
    return fit[idx];
  }

  function spawnGift(gift, w, h, silent = false) {
    const s = styleFor(gift.giftType || gift.giftName);
    const el = document.createElement('div');
    el.className = 'gift ' +
                   pickComboClass(gift.repeatCount) + ' ' + pickTierClass(gift.diamondCount || 0);
    if (gift.giftPictureUrl) {
      el.classList.add('has-image');
      const img = document.createElement('img');
      img.src = gift.giftPictureUrl;
      img.alt = gift.giftName || '';
      img.onerror = () => {
        img.remove();
        el.classList.remove('has-image');
        el.classList.add('no-image');
        el.style.background = s.bg;
        el.textContent = s.glyph;
      };
      el.appendChild(img);
    } else {
      el.classList.add('no-image');
      el.style.background = s.bg;
      el.textContent = s.glyph;
    }

    // Append FIRST so offsetWidth reflects the real CSS size (driven by
    // --gift-base + combo class), then apply the diamond size bonus on top.
    jarContent.appendChild(el);

    if (SETTINGS?.jar?.scaleByDiamonds && gift.diamondCount > 0) {
      const extraScale = 1 + Math.min(0.6, Math.log10(1 + gift.diamondCount) * 0.18);
      const baseW = el.offsetWidth || 56;
      const baseH = el.offsetHeight || 56;
      el.style.width  = (baseW * extraScale) + 'px';
      el.style.height = (baseH * extraScale) + 'px';
    }

    const size = el.offsetWidth || 56;
    const pick = pickPlacement(size);
    if (pick && pick.full) {
      // Jar is full → recycle the oldest gift's slot in place so the heap stays
      // visually full (no top-band + empty-bottom artifact). The new gift takes
      // over the exact spot the removed one occupied.
      const oldest = placedGifts.shift();
      try { oldest?.element?.remove(); } catch {}
      const slot = oldest
        ? { left: oldest.left, top: oldest.top, size }
        : { left: Math.max(0, (jarContent.clientWidth - size) / 2),
            top: Math.max(0, jarContent.clientHeight - size - 4), size };
      placeInside(el, size, slot, silent);
    } else {
      placeInside(el, size, pick, silent);
    }
  }

  function placeInside(el, size, placement, silent) {
    const left = placement.left, landY = placement.top;
    const startR = (-20 + Math.random() * 40);
    const landR  = (-12 + Math.random() * 24) * 0.4;
    el.style.left = left + 'px';
    el.style.top = '0px';
    el.style.setProperty('--land-y', landY + 'px');
    el.style.setProperty('--start-r', startR + 'deg');
    el.style.setProperty('--land-r', landR + 'deg');
    el.style.setProperty('--fall-dur', (1.0 + Math.random() * 0.5) + 's');

    if (silent) {
      el.style.transform = `translateY(${landY}px) rotate(${landR}deg)`;
    } else {
      el.classList.add('falling');
      el.addEventListener('animationend', () => {
        el.style.transform = `translateY(${landY}px) rotate(${landR}deg)`;
        el.classList.remove('falling');
        spawnPuff(left + size / 2, landY + size);
      }, { once: true });
    }

    placedGifts.push({ left, top: landY, size, element: el });
    // Hard safety cap only — normal fullness is handled by slot recycling in
    // spawnGift, which keeps the heap full instead of trimming the bottom rows.
    const MAX = 240;
    while (placedGifts.length > MAX) {
      const oldest = placedGifts.shift();
      try { oldest.element?.remove(); } catch {}
    }
  }

  // Soft landing puff at the gift's base, inside the jar
  function spawnPuff(cx, cy) {
    const p = document.createElement('div');
    p.className = 'puff';
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    jarContent.appendChild(p);
    setTimeout(() => p.remove(), 520);
  }

  function bumpCounter() {
    countEl.classList.remove('bump');
    // reflow so the animation can replay on rapid gifts
    void countEl.offsetWidth;
    countEl.classList.add('bump');
  }
  function showLatest(gift) {
    latestWho.textContent = gift.nickname || gift.uniqueId || 'Someone';
    const giftDisplay = gift.giftName + (gift.repeatCount > 1 ? ` ×${gift.repeatCount}` : '');
    latestWhat.innerHTML = 'sent <em>' + escapeHtml(giftDisplay) + '</em>';
    if (gift.profilePictureUrl) {
      latestAvatar.src = gift.profilePictureUrl;
      latestAvatar.style.display = '';
    } else {
      latestAvatar.removeAttribute('src');
    }
    latestBox.classList.add('show');
    clearTimeout(latestHideTimer);
    latestHideTimer = setTimeout(() => latestBox.classList.remove('show'), 4500);
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ===== Persistence (localStorage) =====
  const STORAGE_KEY = 'kpraewa.jar.v1';
  let recentGifts = [];

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(recentGifts.slice(-50)));
    } catch {}
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch { return []; }
  }

  function onGift(gift) {
    const min = SETTINGS?.jar?.minDiamonds || 0;
    const total = (gift.diamondCount || 0) * (gift.repeatCount || 1);
    if (min > 0 && total < min && !gift.test) {
      console.log('[Jar] skip — gift below minDiamonds', gift.giftName, total, '<', min);
      return;
    }
    recentGifts.push(gift);
    if (recentGifts.length > 50) recentGifts.shift();
    saveState();

    giftTotal += (gift.repeatCount || 1);
    diamondTotal += (gift.diamondCount || 0) * (gift.repeatCount || 1);
    countEl.textContent = giftTotal.toLocaleString();
    diamondEl.textContent = diamondTotal.toLocaleString();
    bumpCounter();
    placeGift(gift);
    showLatest(gift);
  }
  function onClear() {
    jarContent.innerHTML = '';
    placedGifts = [];
    giftTotal = 0; diamondTotal = 0;
    countEl.textContent = '0';
    diamondEl.textContent = '0';
    latestBox.classList.remove('show');
    recentGifts = [];
    try { localStorage.removeItem(STORAGE_KEY); } catch {}
  }

  function replayStoredGifts() {
    const list = loadState();
    if (!list.length) return;
    recentGifts = list;
    for (const g of list) {
      giftTotal += (g.repeatCount || 1);
      diamondTotal += (g.diamondCount || 0) * (g.repeatCount || 1);
      placeGift(g, /* silent */ true);
    }
    countEl.textContent = giftTotal.toLocaleString();
    diamondEl.textContent = diamondTotal.toLocaleString();
    console.log(`[Jar] restored ${list.length} gifts from previous session`);
  }

  const status = document.getElementById('rtStatus');
  const setStatus = (text, color, autoFadeMs) => {
    status.textContent = text;
    status.style.background = color || 'rgba(0,0,0,0.6)';
    status.style.opacity = '0.85';
    if (autoFadeMs) setTimeout(() => { status.style.opacity = '0'; status.style.transition = 'opacity 0.5s'; }, autoFadeMs);
  };

  RealtimeClient.connect().then(rt => {
    setStatus('● connected', 'rgba(40,120,60,0.8)', 3000);
    rt.on('jar:gift', d => { console.log('[Jar] gift received', d); onGift(d); });
    rt.on('jar:clear', () => { console.log('[Jar] clear received'); onClear(); });
    rt.on('settings:update', s => { console.log('[Jar] settings updated'); applyJarSettings(s); });
  }).catch(e => {
    console.error('[Jar] realtime connect failed', e);
    setStatus('● realtime FAILED — check console', 'rgba(180,40,40,0.8)');
  });

  fetch('/api/settings')
    .then(r => r.json())
    .then(s => { applyJarSettings(s); replayStoredGifts(); })
    .catch(() => replayStoredGifts());
</script>
