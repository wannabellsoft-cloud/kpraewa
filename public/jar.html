<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Gift Jar (OBS)</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=JetBrains+Mono:wght@500&family=Sarabun:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    overflow: hidden;
    height: 100vh; width: 100vw;
    font-family: 'Sarabun', sans-serif;
    color: #fff;
    --gift-base: 56px;
  }

  .stage {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 32px;
  }

  /* ===== Header ===== */
  .header {
    position: absolute;
    top: 24px; left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
  }
  .header .label {
    font-size: 11px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.65);
    font-weight: 600;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
  .header .count {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 64px;
    line-height: 1;
    margin-top: 4px;
    color: #ffe5ec;
    text-shadow: 0 4px 16px rgba(255, 100, 140, 0.6), 0 0 24px rgba(255, 150, 180, 0.4);
    font-weight: 500;
    transition: transform 0.3s cubic-bezier(.34,1.6,.6,1);
  }
  .header .count.bump { transform: scale(1.18); }
  .header .sub {
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(255,229,236,0.7);
    font-weight: 500;
    margin-top: 6px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }
  /* Lab theme tweaks the header palette */
  .stage.theme-lab .header .count {
    color: #d6ffeb;
    text-shadow: 0 4px 16px rgba(90, 220, 200, 0.65), 0 0 24px rgba(120, 240, 220, 0.4);
  }
  .stage.theme-lab .header .sub { color: rgba(214,255,235,0.7); }

  /* ===== Jar container ===== */
  .jar-container {
    position: relative;
    width: 380px;
    height: 540px;
  }
  .jar-svg {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 3;
    filter: drop-shadow(0 30px 40px rgba(0,0,0,0.35));
  }

  /* Glass-theme gift area — round chubby jar.
     Starts BELOW the bow + chain + heart pendant (~y=345) and clips
     to the rounded bottom-half body so gifts always sit inside glass. */
  .jar-content {
    position: absolute;
    left: 56px;
    right: 56px;
    top: 345px;
    bottom: 36px;
    overflow: hidden;
    clip-path: polygon(
      0% 0%, 100% 0%,
      100% 56%,
      92% 80%, 78% 95%, 60% 100%,
      40% 100%, 22% 95%, 8% 80%,
      0% 56%
    );
    z-index: 2;
  }
  /* Lab-theme gift area — clip-path traces the Erlenmeyer cone so gifts
     are only visible inside the actual flask glass. Edges of the
     bounding box that fall outside the cone are masked away. */
  .stage.theme-lab .jar-content {
    left: 50px;
    right: 50px;
    top: 220px;
    bottom: 30px;
    border-radius: 0 0 70px 70px / 0 0 40px 40px;
    /* Top of content (y=0) corresponds to the flask neck base (x ≈ 37-63%).
       Bottom (y=100%) opens to the full body width. */
    clip-path: polygon(
      36.5% 0%,
      63.5% 0%,
      100% 96%,
      88% 100%,
      12% 100%,
      0% 96%
    );
  }

  /* ===== Theme show/hide ===== */
  .theme-svg { display: none; }
  .stage.theme-glass .theme-glass { display: block; }
  .stage.theme-lab   .theme-lab   { display: block; }

  /* ===== Gift element ===== */
  .gift {
    position: absolute;
    width: var(--gift-base);
    height: var(--gift-base);
    display: flex; align-items: center; justify-content: center;
    border-radius: 14px;
    font-weight: 700;
    color: #1a1416;
    font-size: 22px;
    box-shadow:
      inset 0 -6px 14px rgba(0,0,0,0.15),
      inset 0 3px 6px rgba(255,255,255,0.35),
      0 4px 14px rgba(0,0,0,0.3);
    will-change: transform, opacity;
    user-select: none;
    overflow: hidden;
  }
  .gift.has-image {
    background: transparent !important;
    border-radius: 0;
    box-shadow: none;
    overflow: visible;            /* let drop-shadow extend beyond the box */
  }
  .gift.has-image img {
    width: 100%; height: 100%;
    object-fit: contain;
    border-radius: 0;
    display: block;
    /* drop-shadow follows the PNG alpha, so the shadow traces the real
       gift silhouette instead of an ugly square halo */
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5));
  }
  .gift.no-image { color: rgba(0,0,0,0.55); }
  .gift.combo-2  { width: calc(var(--gift-base) * 1.18); height: calc(var(--gift-base) * 1.18); }
  .gift.combo-5  { width: calc(var(--gift-base) * 1.35); height: calc(var(--gift-base) * 1.35); }
  .gift.combo-10 { width: calc(var(--gift-base) * 1.6);  height: calc(var(--gift-base) * 1.6); }
  .gift.combo-50 { width: calc(var(--gift-base) * 1.85); height: calc(var(--gift-base) * 1.85); }
  .gift.tier-pricey { box-shadow:
    inset 0 -6px 14px rgba(0,0,0,0.18),
    inset 0 3px 6px rgba(255,255,255,0.4),
    0 6px 22px rgba(255,180,120,0.5),
    0 0 14px rgba(255,200,140,0.5); }
  .gift.tier-luxe { box-shadow:
    inset 0 -6px 14px rgba(0,0,0,0.2),
    inset 0 3px 6px rgba(255,255,255,0.45),
    0 8px 28px rgba(255,120,180,0.65),
    0 0 22px rgba(255,140,200,0.7); }

  @keyframes fall {
    0%   { transform: translateY(-180px) rotate(var(--start-r, -30deg)); opacity: 0; }
    15%  { opacity: 1; }
    70%  { transform: translateY(var(--land-y)) rotate(var(--land-r, 0deg)); }
    82%  { transform: translateY(calc(var(--land-y) - 14px)) rotate(var(--land-r, 0deg)); }
    92%  { transform: translateY(var(--land-y)) rotate(var(--land-r, 0deg)); }
    100% { transform: translateY(var(--land-y)) rotate(var(--land-r, 0deg)); }
  }
  .gift.falling { animation: fall var(--fall-dur, 1.4s) cubic-bezier(.45,.05,.7,1) forwards; }

  @keyframes pop {
    0% { transform: scale(0); opacity: 0; }
    50% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(0); opacity: 0; }
  }
  .combo-flash {
    position: absolute;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 64px;
    color: #ffd166;
    text-shadow: 0 0 16px rgba(255,209,102,0.7), 0 4px 12px rgba(0,0,0,0.5);
    pointer-events: none;
    animation: pop 1s ease forwards;
    z-index: 5;
  }

  /* Latest gifter banner */
  .latest {
    position: absolute;
    bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 999px;
    padding: 10px 22px;
    display: flex; align-items: center; gap: 12px;
    opacity: 0;
    transition: opacity 0.4s, transform 0.4s cubic-bezier(.34,1.6,.6,1);
    pointer-events: none;
    z-index: 4;
  }
  .latest.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .latest .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff8cab, #d4677c);
    border: 2px solid #fff;
    overflow: hidden;
    flex-shrink: 0;
  }
  .stage.theme-lab .latest .avatar {
    background: linear-gradient(135deg, #5ed4c8, #2a8076);
  }
  .latest .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .latest .info { display: flex; flex-direction: column; line-height: 1.15; }
  .latest .info .who { font-size: 14px; font-weight: 700; color: #fff; }
  .latest .info .what {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,229,236,0.85);
    font-weight: 500;
  }
  .latest .info .what em { color: #ffd166; font-style: normal; font-weight: 700; }
  .stage.theme-lab .latest .info .what { color: rgba(214,255,235,0.85); }
  .stage.theme-lab .latest .info .what em { color: #9ef0d8; }

  /* Lab theme — bubbles rising through the liquid */
  .bubble {
    position: absolute;
    bottom: 50px;
    width: 6px; height: 6px;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.3));
    border-radius: 50%;
    opacity: 0;
    animation: rise 3.4s ease-in infinite;
    pointer-events: none;
    z-index: 3;
  }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    10%  { opacity: 0.9; }
    100% { transform: translateY(-180px) translateX(var(--drift, 0px)); opacity: 0; }
  }
</style>
</head>
<body>

<div id="rtStatus" style="
  position: fixed; top: 10px; left: 10px; z-index: 99;
  background: rgba(0,0,0,0.6); color: #ffe5ec; font-family: sans-serif;
  font-size: 11px; padding: 4px 10px; border-radius: 999px;
  letter-spacing: 0.08em; opacity: 0.6;">connecting…</div>

<div class="stage theme-glass" id="stage">

  <div class="header">
    <div class="label">Gifts received</div>
    <div class="count" id="giftCount">0</div>
    <div class="sub"><span id="diamondTotal">0</span> diamonds</div>
  </div>

  <div class="jar-container" id="jarContainer">

    <!-- ========== Open-mouth round jar (watercolor sketch style) ========== -->
    <svg class="jar-svg theme-svg theme-glass" viewBox="0 0 380 540" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Pink-tinted glass interior fade -->
        <radialGradient id="g_glassInner" cx="50%" cy="58%" r="60%">
          <stop offset="0%"  stop-color="rgba(255,225,235,0.04)"/>
          <stop offset="70%" stop-color="rgba(255,200,215,0.14)"/>
          <stop offset="100%" stop-color="rgba(240,150,180,0.28)"/>
        </radialGradient>
        <!-- Bow main fill (soft pink) -->
        <linearGradient id="g_bow" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%"   stop-color="#ffd6e0"/>
          <stop offset="100%" stop-color="#f29ab1"/>
        </linearGradient>
        <!-- Knot/darker bow fill -->
        <linearGradient id="g_knot" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%"   stop-color="#f29ab1"/>
          <stop offset="100%" stop-color="#c8657d"/>
        </linearGradient>
        <!-- Heart gradient -->
        <linearGradient id="g_heart" x1="0" x2="1" y1="0" y2="1">
          <stop offset="0%"   stop-color="#ffabc2"/>
          <stop offset="100%" stop-color="#d4677c"/>
        </linearGradient>
        <!-- Side pink wash for body shading -->
        <linearGradient id="g_pinkWash" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%"   stop-color="rgba(245,150,180,0)"/>
          <stop offset="50%"  stop-color="rgba(245,150,180,0.35)"/>
          <stop offset="100%" stop-color="rgba(245,150,180,0)"/>
        </linearGradient>
      </defs>

      <!-- ====== Cylindrical-bulged body (drawn FIRST, behind everything) ====== -->
      <path d="M 65 195
               C 38 240 32 380 64 470
               Q 82 510 132 510
               L 248 510
               Q 298 510 316 470
               C 348 380 342 240 315 195
               Z"
            fill="url(#g_glassInner)"
            stroke="#c47585" stroke-width="2.4" stroke-linejoin="round"/>

      <!-- Sketchy double stroke (left + right edges) for watercolor feel -->
      <path d="M 68 205 C 42 248 36 380 68 462"
            fill="none" stroke="#e89bb0" stroke-width="1" opacity="0.55"/>
      <path d="M 312 205 C 338 248 344 380 312 462"
            fill="none" stroke="#e89bb0" stroke-width="1" opacity="0.55"/>

      <!-- Pink wash on left side -->
      <path d="M 52 250 Q 36 350 70 460" fill="none"
            stroke="url(#g_pinkWash)" stroke-width="22" opacity="0.5"/>
      <!-- Pink wash on right -->
      <path d="M 328 250 Q 344 350 310 460" fill="none"
            stroke="url(#g_pinkWash)" stroke-width="22" opacity="0.5"/>

      <!-- Bottom inner ellipses (gives the floor depth) -->
      <ellipse cx="190" cy="478" rx="105" ry="8" fill="rgba(245,166,187,0.4)"/>
      <ellipse cx="190" cy="488" rx="86" ry="4" fill="rgba(245,166,187,0.28)"/>
      <ellipse cx="190" cy="495" rx="65" ry="2.5" fill="rgba(245,166,187,0.2)"/>

      <!-- Glass white highlights -->
      <path d="M 84 240 Q 72 340 96 440"
            fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
      <path d="M 100 270 Q 96 350 105 410"
            fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.4"/>
      <path d="M 296 250 Q 308 340 290 430"
            fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2.2" opacity="0.75"/>

      <!-- ====== Open mouth ====== -->
      <!-- Outer rim ellipse (the rim itself, seen edge-on) -->
      <ellipse cx="190" cy="110" rx="130" ry="20"
               fill="rgba(255,240,245,0.35)"
               stroke="#c47585" stroke-width="2.4"/>
      <!-- Inner rim (depth into the jar) -->
      <ellipse cx="190" cy="120" rx="118" ry="14"
               fill="rgba(245,180,200,0.18)"
               stroke="#c47585" stroke-width="1.6" opacity="0.75"/>
      <!-- Innermost (deeper) line -->
      <ellipse cx="190" cy="125" rx="108" ry="10"
               fill="none" stroke="#e89bb0" stroke-width="1" opacity="0.55"/>

      <!-- ====== Screw threads (3 sketchy curves on the neck) ====== -->
      <path d="M 60 152 Q 80 160 190 162 Q 300 160 320 152"
            fill="none" stroke="#c47585" stroke-width="1.6" opacity="0.7"/>
      <path d="M 56 175 Q 80 184 190 186 Q 300 184 324 175"
            fill="none" stroke="#c47585" stroke-width="1.6" opacity="0.6"/>
      <path d="M 58 196 Q 80 204 190 206 Q 300 204 322 196"
            fill="none" stroke="#c47585" stroke-width="1.6" opacity="0.5"/>

      <!-- ====== Ruffled collar around neck ====== -->
      <path d="M 75 200
               L 305 200
               Q 312 200 312 210
               Q 312 232 305 240
               Q 295 244 282 244
               Q 278 252 270 252
               Q 268 248 262 248
               Q 258 252 250 252
               Q 248 246 242 246
               L 138 246
               Q 132 246 130 252
               Q 122 252 118 248
               Q 112 252 108 252
               Q 100 252 96 244
               Q 80 244 72 240
               Q 68 232 68 210
               Q 68 200 75 200 Z"
            fill="url(#g_bow)"
            stroke="#c8657d" stroke-width="2" stroke-linejoin="round"/>
      <!-- Collar pleat lines -->
      <g stroke="#c8657d" stroke-width="1" opacity="0.6">
        <path d="M 95 205 Q 96 225 99 244" fill="none"/>
        <path d="M 115 205 Q 116 225 119 248" fill="none"/>
        <path d="M 270 205 Q 269 225 266 248" fill="none"/>
        <path d="M 290 205 Q 289 225 286 244" fill="none"/>
      </g>
      <!-- Collar shading band -->
      <path d="M 80 225 Q 190 232 300 225"
            fill="none" stroke="rgba(168,85,108,0.35)" stroke-width="2"/>

      <!-- ====== Bow (left wing) — wider and more flat ====== -->
      <path d="M 188 215
               C 150 200  98 220  90 258
               C 86 285 110 296 142 292
               C 168 289 188 270 188 245 Z"
            fill="url(#g_bow)"
            stroke="#c8657d" stroke-width="2" stroke-linejoin="round"/>
      <path d="M 122 248 Q 142 268 168 270"
            fill="none" stroke="#c8657d" stroke-width="1.3" opacity="0.7"/>
      <path d="M 100 245 Q 116 282 138 290"
            fill="none" stroke="#c8657d" stroke-width="1" opacity="0.5"/>

      <!-- ====== Bow (right wing) ====== -->
      <path d="M 192 215
               C 230 200 282 220 290 258
               C 294 285 270 296 238 292
               C 212 289 192 270 192 245 Z"
            fill="url(#g_bow)"
            stroke="#c8657d" stroke-width="2" stroke-linejoin="round"/>
      <path d="M 258 248 Q 238 268 212 270"
            fill="none" stroke="#c8657d" stroke-width="1.3" opacity="0.7"/>
      <path d="M 280 245 Q 264 282 242 290"
            fill="none" stroke="#c8657d" stroke-width="1" opacity="0.5"/>

      <!-- ====== Bow tails ====== -->
      <path d="M 168 258
               Q 156 308 152 348
               L 170 350
               L 184 320 Z"
            fill="url(#g_bow)" stroke="#c8657d" stroke-width="2" stroke-linejoin="round"/>
      <path d="M 212 258
               Q 224 308 228 348
               L 210 350
               L 196 320 Z"
            fill="url(#g_bow)" stroke="#c8657d" stroke-width="2" stroke-linejoin="round"/>
      <!-- Tail shading -->
      <path d="M 162 268 Q 158 308 162 344"
            fill="none" stroke="#c8657d" stroke-width="0.9" opacity="0.55"/>
      <path d="M 218 268 Q 222 308 218 344"
            fill="none" stroke="#c8657d" stroke-width="0.9" opacity="0.55"/>

      <!-- ====== Center knot ====== -->
      <ellipse cx="190" cy="248" rx="22" ry="26"
               fill="url(#g_knot)" stroke="#a8556c" stroke-width="2"/>
      <!-- Knot side seams -->
      <path d="M 176 226 Q 176 250 176 270" stroke="#a8556c" stroke-width="1" fill="none" opacity="0.5"/>
      <path d="M 204 226 Q 204 250 204 270" stroke="#a8556c" stroke-width="1" fill="none" opacity="0.5"/>

      <!-- ====== Heart on the knot ====== -->
      <path d="M 190 244
               c -7,-8 -18,-3 -14,6
               c 4,8 14,15 14,15
               c 0,0 10,-7 14,-15
               c 4,-9 -7,-14 -14,-6 Z"
            fill="url(#g_heart)" stroke="#a8556c" stroke-width="1.5"/>
      <ellipse cx="184" cy="248" rx="2.5" ry="4" fill="rgba(255,255,255,0.8)"/>

      <!-- ====== Chain + pendant heart ====== -->
      <line x1="190" y1="276" x2="190" y2="302"
            stroke="#a8556c" stroke-width="1.5"/>
      <ellipse cx="190" cy="304" rx="4.5" ry="3"
               fill="#f5d68a" stroke="#b48a3e" stroke-width="0.9"/>
      <path d="M 190 312
               c -9,-11 -22,-4 -17,7
               c 4,9 17,20 17,20
               c 0,0 13,-11 17,-20
               c 5,-11 -8,-18 -17,-7 Z"
            fill="url(#g_heart)" stroke="#a8556c" stroke-width="1.4"/>
      <ellipse cx="184" cy="322" rx="3" ry="5" fill="rgba(255,255,255,0.75)"/>

      <!-- ====== Sparkles outside the jar ====== -->
      <g fill="#f29ab1" opacity="0.8">
        <path d="M 24 220 l 1.5 -5 l 1.5 5 l 5 1.5 l -5 1.5 l -1.5 5 l -1.5 -5 l -5 -1.5 z"/>
        <path d="M 354 300 l 1.5 -5 l 1.5 5 l 5 1.5 l -5 1.5 l -1.5 5 l -1.5 -5 l -5 -1.5 z"/>
        <path d="M 24 400 l 1 -3.5 l 1 3.5 l 3.5 1 l -3.5 1 l -1 3.5 l -1 -3.5 l -3.5 -1 z"/>
        <path d="M 356 430 l 1 -3 l 1 3 l 3 1 l -3 1 l -1 3 l -1 -3 l -3 -1 z"/>
      </g>
      <g fill="#ffabc2" opacity="0.65">
        <path d="M 14 320 c -2,-3 -6,-1.5 -5,1.5 c 1,2 5,4 5,5 c 0,0 4,-3 5,-5 c 1,-3 -3,-4.5 -5,-1.5 z"/>
        <path d="M 366 380 c -2,-3 -6,-1.5 -5,1.5 c 1,2 5,4 5,5 c 0,0 4,-3 5,-5 c 1,-3 -3,-4.5 -5,-1.5 z"/>
      </g>
    </svg>

    <!-- ========== Lab Erlenmeyer flask ========== -->
    <svg class="jar-svg theme-svg theme-lab" viewBox="0 0 380 540" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="l_glass" x1="0" x2="1" y1="0" y2="1">
          <stop offset="0%" stop-color="rgba(180,255,235,0.18)"/>
          <stop offset="50%" stop-color="rgba(140,220,210,0.05)"/>
          <stop offset="100%" stop-color="rgba(180,255,235,0.15)"/>
        </linearGradient>
        <linearGradient id="l_liquid" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#7be4d2"/>
          <stop offset="60%" stop-color="#4ab8a6"/>
          <stop offset="100%" stop-color="#296861"/>
        </linearGradient>
        <linearGradient id="l_cork" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#c79c6a"/>
          <stop offset="100%" stop-color="#7e5a35"/>
        </linearGradient>
        <linearGradient id="l_shine" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
          <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
        </linearGradient>
      </defs>

      <!-- Cork stopper -->
      <ellipse cx="190" cy="40" rx="44" ry="6" fill="rgba(199,156,106,0.85)"/>
      <rect x="146" y="38" width="88" height="22" rx="3" fill="url(#l_cork)" stroke="rgba(80,55,30,0.6)" stroke-width="1"/>
      <line x1="160" y1="48" x2="220" y2="48" stroke="rgba(80,55,30,0.4)" stroke-width="0.8"/>

      <!-- Neck (cylinder) -->
      <rect x="153" y="60" width="74" height="160"
            fill="url(#l_glass)"
            stroke="rgba(190,250,230,0.6)" stroke-width="2"/>
      <!-- Neck rim -->
      <rect x="148" y="60" width="84" height="8" rx="2"
            fill="rgba(190,250,230,0.4)"
            stroke="rgba(190,250,230,0.6)" stroke-width="1.5"/>

      <!-- Body (Erlenmeyer cone) -->
      <path d="M 153 220
               L 50 460
               Q 50 510 100 510
               L 280 510
               Q 330 510 330 460
               L 227 220
               Z"
            fill="url(#l_glass)"
            stroke="rgba(190,250,230,0.7)"
            stroke-width="2"/>

      <!-- Measurement marks on side -->
      <g stroke="rgba(190,250,230,0.55)" stroke-width="1.2">
        <line x1="78"  y1="320" x2="100" y2="320"/>
        <line x1="68"  y1="380" x2="90"  y2="380"/>
        <line x1="58"  y1="440" x2="80"  y2="440"/>
      </g>
      <g font-family="JetBrains Mono, monospace" font-size="10" fill="rgba(214,255,235,0.7)" text-anchor="end" letter-spacing="0.5">
        <text x="75"  y="324">100</text>
        <text x="65"  y="384">250</text>
        <text x="55"  y="444">500</text>
      </g>

      <!-- Bubbling liquid pool -->
      <path d="M 60 470
               L 60 460
               Q 60 505 110 505
               L 270 505
               Q 320 505 320 460
               L 320 470
               Z"
            fill="url(#l_liquid)" opacity="0.65"/>
      <!-- Liquid surface line -->
      <path d="M 60 470 Q 130 462 190 472 T 320 470"
            fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.3"/>

      <!-- Label band -->
      <rect x="100" y="370" width="180" height="46" rx="6"
            fill="rgba(20,40,38,0.55)"
            stroke="rgba(190,250,230,0.4)" stroke-width="1"/>
      <text x="190" y="392" text-anchor="middle"
            font-family="Cormorant Garamond, serif"
            font-style="italic" font-weight="600"
            font-size="14" fill="#d6ffeb" letter-spacing="2">k.praewa LAB</text>
      <text x="190" y="408" text-anchor="middle"
            font-family="JetBrains Mono, monospace"
            font-size="9" fill="rgba(214,255,235,0.75)" letter-spacing="2">EXPERIMENT N°001</text>

      <!-- Highlights -->
      <path d="M 80 260 L 60 460" stroke="url(#l_shine)" stroke-width="6" opacity="0.5"/>
      <path d="M 250 260 L 295 440" stroke="url(#l_shine)" stroke-width="3" opacity="0.3"/>

      <!-- Tiny chemistry sparkles around the flask -->
      <g fill="rgba(214,255,235,0.55)">
        <path d="M 28 260 l 1.5 -4 l 1.5 4 l 4 1.5 l -4 1.5 l -1.5 4 l -1.5 -4 l -4 -1.5 z"/>
        <path d="M 352 290 l 1.5 -4 l 1.5 4 l 4 1.5 l -4 1.5 l -1.5 4 l -1.5 -4 l -4 -1.5 z"/>
        <path d="M 18 410 l 1 -3 l 1 3 l 3 1 l -3 1 l -1 3 l -1 -3 l -3 -1 z"/>
      </g>
    </svg>

    <!-- Bubbles (Lab theme only — CSS hides on Glass) -->
    <div class="lab-bubbles" id="labBubbles"></div>

    <!-- Gifts pile up inside this -->
    <div class="jar-content" id="jarContent"></div>

    <!-- Latest gifter banner -->
    <div class="latest" id="latest">
      <div class="avatar"><img id="latestAvatar" alt=""/></div>
      <div class="info">
        <div class="who" id="latestWho"></div>
        <div class="what" id="latestWhat"></div>
      </div>
    </div>
  </div>

</div>

<script src="/assets/realtime-client.js"></script>
<script>
  const jarContent = document.getElementById('jarContent');
  const jarContainer = document.getElementById('jarContainer');
  const stage = document.getElementById('stage');
  const countEl = document.getElementById('giftCount');
  const diamondEl = document.getElementById('diamondTotal');
  const latestBox = document.getElementById('latest');
  const latestWho = document.getElementById('latestWho');
  const latestWhat = document.getElementById('latestWhat');
  const latestAvatar = document.getElementById('latestAvatar');
  const labBubblesBox = document.getElementById('labBubbles');

  let giftTotal = 0;
  let diamondTotal = 0;
  let latestHideTimer;
  // Physics state: every placed gift's bounding box so newcomers can stack on them.
  // { left, top, size, element }
  let placedGifts = [];

  // Runtime settings — overridden by /api/settings + realtime updates
  let SETTINGS = {
    jar: { theme: 'glass', minDiamonds: 0, baseSize: 56, scaleByDiamonds: true }
  };

  function applyJarSettings(s) {
    const j = s?.jar || {};
    const theme = (j.theme === 'lab') ? 'lab' : 'glass';
    stage.classList.toggle('theme-glass', theme === 'glass');
    stage.classList.toggle('theme-lab',   theme === 'lab');
    document.documentElement.style.setProperty('--gift-base', (j.baseSize || 56) + 'px');
    SETTINGS = s;
    // bubble layer presence
    renderBubbles(theme === 'lab' ? 8 : 0);
  }

  function renderBubbles(n) {
    labBubblesBox.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const b = document.createElement('div');
      b.className = 'bubble';
      b.style.left = (60 + Math.random() * 260) + 'px';
      b.style.setProperty('--drift', (Math.random() * 30 - 15) + 'px');
      b.style.animationDelay = (i * 0.5) + 's';
      b.style.animationDuration = (3 + Math.random() * 2) + 's';
      labBubblesBox.appendChild(b);
    }
  }

  // ===== Gift styling fallbacks (when no TikTok image URL) =====
  const GIFT_STYLES = {
    rose:       { bg: 'linear-gradient(135deg,#ffb8c5,#e093a1)', glyph: '✿' },
    heart:      { bg: 'linear-gradient(135deg,#ff8ca0,#d4677c)', glyph: '♥' },
    star:       { bg: 'linear-gradient(135deg,#ffe28a,#ffd166)', glyph: '★' },
    diamond:    { bg: 'linear-gradient(135deg,#a3d4ff,#5eb0ff)', glyph: '♦' },
    coin:       { bg: 'linear-gradient(135deg,#ffe28a,#d4af6a)', glyph: '$' },
    crown:      { bg: 'linear-gradient(135deg,#ffd56b,#b48a3e)', glyph: '♕' },
    cake:       { bg: 'linear-gradient(135deg,#ffcfd9,#f095a8)', glyph: '◉' },
    coffee:     { bg: 'linear-gradient(135deg,#d6a572,#8c5a30)', glyph: '◈' },
    galaxy:     { bg: 'linear-gradient(135deg,#7f5af0,#3a1f6b)', glyph: '✦' },
    universe:   { bg: 'linear-gradient(135deg,#5a4a8a,#1a1340)', glyph: '✧' },
    rainbow:    { bg: 'linear-gradient(135deg,#ff9aa2,#ffb482,#ffe28a,#9ee6a0,#9ad7e0,#bda2eb)', glyph: '◐' }
  };
  function styleFor(type) {
    const key = (type || '').toLowerCase();
    for (const k of Object.keys(GIFT_STYLES)) if (key.includes(k)) return GIFT_STYLES[k];
    return { bg: 'linear-gradient(135deg,#ffc7d5,#e093a1)', glyph: '◆' };
  }

  function pickComboClass(repeat) {
    if (repeat >= 50) return 'combo-50';
    if (repeat >= 10) return 'combo-10';
    if (repeat >= 5)  return 'combo-5';
    if (repeat >= 2)  return 'combo-2';
    return '';
  }
  function pickTierClass(diamonds) {
    if (diamonds >= 100) return 'tier-luxe';
    if (diamonds >= 20)  return 'tier-pricey';
    return '';
  }

  function placeGift(gift, silent = false) {
    const w = jarContent.clientWidth;
    const h = jarContent.clientHeight;
    const repeat = Math.max(1, gift.repeatCount || 1);
    const drops = Math.min(repeat, 12);
    if (silent) {
      for (let i = 0; i < drops; i++) spawnGift(gift, w, h, true);
      return;
    }
    for (let i = 0; i < drops; i++) {
      setTimeout(() => spawnGift(gift, w, h, false), i * 90);
    }
    if (repeat >= 5) {
      const flash = document.createElement('div');
      flash.className = 'combo-flash';
      flash.textContent = '×' + repeat;
      flash.style.top = '40%';
      flash.style.left = '50%';
      flash.style.transform = 'translate(-50%,-50%)';
      jarContainer.appendChild(flash);
      setTimeout(() => flash.remove(), 1100);
    }
  }

  // ===== Stacking physics =====
  // Find the lowest Y (highest number) at which a gift of given size centered
  // at centerX would rest without overlapping anything already placed.
  function findStackY(centerX, size) {
    const h = jarContent.clientHeight;
    let y = h - size - 4;          // start on the floor
    for (const p of placedGifts) {
      const pCenterX = p.left + p.size / 2;
      const horzDist = Math.abs(centerX - pCenterX);
      const minHorz = (size + p.size) / 2 * 0.85;   // allow a small overlap for natural look
      if (horzDist < minHorz) {
        const candidate = p.top - size + Math.min(size, p.size) * 0.18;
        if (candidate < y) y = candidate;
      }
    }
    return y;
  }

  function pickPlacement(size) {
    const w = jarContent.clientWidth;
    const h = jarContent.clientHeight;
    const isLab = stage.classList.contains('theme-lab');
    const candidates = [];

    for (let i = 0; i < 40; i++) {
      let centerX;
      if (isLab) {
        centerX = w * 0.5 + (Math.random() - 0.5) * w * 0.88;
      } else {
        const padX = 4;
        centerX = padX + size / 2 + Math.random() * Math.max(0, (w - size - padX * 2));
      }
      const left = centerX - size / 2;
      if (left < 2 || left + size > w - 2) continue;
      const top = findStackY(centerX, size);

      if (isLab) {
        const cy = top + size / 2;
        const yRatio = Math.max(0, Math.min(1, cy / h));
        const halfwidth = 0.13 + (0.50 - 0.13) * yRatio;
        const minCx = (0.5 - halfwidth) * w;
        const maxCx = (0.5 + halfwidth) * w;
        if (centerX < minCx || centerX > maxCx) continue;
      }
      candidates.push({ left, top, size });
    }

    if (!candidates.length) {
      return { left: w / 2 - size / 2, top: 0, size };
    }

    // Sort by Y descending — biggest Y = deepest in the jar = preferred so
    // the bottom fills up first before the stack starts climbing.
    candidates.sort((a, b) => b.top - a.top);

    // Bias toward the best (deepest) candidate but keep enough randomness
    // that gifts spread sideways naturally instead of forming a tower.
    const pickFrom = Math.min(5, candidates.length);
    const r = Math.pow(Math.random(), 2.4);  // weighted toward 0 (best)
    const idx = Math.floor(r * pickFrom);
    return candidates[idx];
  }

  function spawnGift(gift, w, h, silent = false) {
    const s = styleFor(gift.giftType || gift.giftName);
    const el = document.createElement('div');
    el.className = 'gift ' + (silent ? '' : 'falling ') +
                   pickComboClass(gift.repeatCount) + ' ' + pickTierClass(gift.diamondCount || 0);
    if (gift.giftPictureUrl) {
      el.classList.add('has-image');
      const img = document.createElement('img');
      img.src = gift.giftPictureUrl;
      img.alt = gift.giftName || '';
      img.onerror = () => {
        img.remove();
        el.classList.remove('has-image');
        el.classList.add('no-image');
        el.style.background = s.bg;
        el.textContent = s.glyph;
      };
      el.appendChild(img);
    } else {
      el.classList.add('no-image');
      el.style.background = s.bg;
      el.textContent = s.glyph;
    }

    // Diamond-based size bonus — applied via width/height (NOT transform),
    // so the falling animation still owns the transform property.
    let extraScale = 1;
    if (SETTINGS?.jar?.scaleByDiamonds && gift.diamondCount > 0) {
      extraScale = 1 + Math.min(0.6, Math.log10(1 + gift.diamondCount) * 0.18);
    }
    if (extraScale !== 1) {
      // Read the post-combo size first, then apply diamond multiplier on top.
      const baseW = el.offsetWidth || 56;
      const baseH = el.offsetHeight || 56;
      el.style.width  = (baseW * extraScale) + 'px';
      el.style.height = (baseH * extraScale) + 'px';
    }

    // Pick a physically reasonable resting spot
    const size = el.offsetWidth || 56;
    const placement = pickPlacement(size);
    const left = placement.left;
    const landY = placement.top;
    const startR = (-20 + Math.random() * 40);
    const landR  = (-12 + Math.random() * 24) * 0.4;   // very soft so the pile reads as solid objects

    el.style.left = left + 'px';
    el.style.top = '0px';
    el.style.setProperty('--land-y', landY + 'px');
    el.style.setProperty('--start-r', startR + 'deg');
    el.style.setProperty('--land-r', landR + 'deg');
    el.style.setProperty('--fall-dur', (1.0 + Math.random() * 0.5) + 's');

    if (silent) {
      el.style.transform = `translateY(${landY}px) rotate(${landR}deg)`;
    }

    jarContent.appendChild(el);

    // Record the placement so future gifts stack on top of it
    const placementRec = { left, top: landY, size, element: el };
    placedGifts.push(placementRec);

    if (!silent) {
      el.addEventListener('animationend', () => {
        el.style.transform = `translateY(${landY}px) rotate(${landR}deg)`;
        el.classList.remove('falling');
      }, { once: true });
    }

    const MAX = 80;
    while (placedGifts.length > MAX) {
      const oldest = placedGifts.shift();
      try { oldest.element?.remove(); } catch {}
    }
    while (jarContent.childElementCount > MAX) jarContent.firstElementChild.remove();
  }

  function bumpCounter() {
    countEl.classList.add('bump');
    setTimeout(() => countEl.classList.remove('bump'), 320);
  }
  function showLatest(gift) {
    latestWho.textContent = gift.nickname || gift.uniqueId || 'Someone';
    const giftDisplay = gift.giftName + (gift.repeatCount > 1 ? ` ×${gift.repeatCount}` : '');
    latestWhat.innerHTML = 'sent <em>' + escapeHtml(giftDisplay) + '</em>';
    if (gift.profilePictureUrl) {
      latestAvatar.src = gift.profilePictureUrl;
      latestAvatar.style.display = '';
    } else {
      latestAvatar.removeAttribute('src');
    }
    latestBox.classList.add('show');
    clearTimeout(latestHideTimer);
    latestHideTimer = setTimeout(() => latestBox.classList.remove('show'), 4500);
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ===== Persistence (localStorage) =====
  // The jar keeps its contents across page refreshes / OBS scene reloads,
  // and only clears when (a) /api/jar/clear is hit, or (b) the bridge
  // detects a long gap and emits clear automatically.
  const STORAGE_KEY = 'kpraewa.jar.v1';
  let recentGifts = [];

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(recentGifts.slice(-50)));
    } catch {}
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch { return []; }
  }

  function onGift(gift) {
    // Client-side belt+braces (server already filters)
    const min = SETTINGS?.jar?.minDiamonds || 0;
    const total = (gift.diamondCount || 0) * (gift.repeatCount || 1);
    if (min > 0 && total < min && !gift.test) {
      console.log('[Jar] skip — gift below minDiamonds', gift.giftName, total, '<', min);
      return;
    }
    recentGifts.push(gift);
    if (recentGifts.length > 50) recentGifts.shift();
    saveState();

    giftTotal += (gift.repeatCount || 1);
    diamondTotal += (gift.diamondCount || 0) * (gift.repeatCount || 1);
    countEl.textContent = giftTotal.toLocaleString();
    diamondEl.textContent = diamondTotal.toLocaleString();
    bumpCounter();
    placeGift(gift);
    showLatest(gift);
  }
  function onClear() {
    jarContent.innerHTML = '';
    placedGifts = [];
    giftTotal = 0; diamondTotal = 0;
    countEl.textContent = '0';
    diamondEl.textContent = '0';
    latestBox.classList.remove('show');
    recentGifts = [];
    try { localStorage.removeItem(STORAGE_KEY); } catch {}
  }

  function replayStoredGifts() {
    const list = loadState();
    if (!list.length) return;
    recentGifts = list;
    for (const g of list) {
      giftTotal += (g.repeatCount || 1);
      diamondTotal += (g.diamondCount || 0) * (g.repeatCount || 1);
      placeGift(g, /* silent */ true);
    }
    countEl.textContent = giftTotal.toLocaleString();
    diamondEl.textContent = diamondTotal.toLocaleString();
    console.log(`[Jar] restored ${list.length} gifts from previous session`);
  }

  const status = document.getElementById('rtStatus');
  const setStatus = (text, color, autoFadeMs) => {
    status.textContent = text;
    status.style.background = color || 'rgba(0,0,0,0.6)';
    status.style.opacity = '0.85';
    if (autoFadeMs) setTimeout(() => { status.style.opacity = '0'; status.style.transition = 'opacity 0.5s'; }, autoFadeMs);
  };

  RealtimeClient.connect().then(rt => {
    setStatus('● connected', 'rgba(40,120,60,0.8)', 3000);
    rt.on('jar:gift', d => { console.log('[Jar] gift received', d); onGift(d); });
    rt.on('jar:clear', () => { console.log('[Jar] clear received'); onClear(); });
    rt.on('settings:update', s => { console.log('[Jar] settings updated'); applyJarSettings(s); });
  }).catch(e => {
    console.error('[Jar] realtime connect failed', e);
    setStatus('● realtime FAILED — check console', 'rgba(180,40,40,0.8)');
  });

  fetch('/api/settings')
    .then(r => r.json())
    .then(s => { applyJarSettings(s); replayStoredGifts(); })
    .catch(() => replayStoredGifts());
</script>
